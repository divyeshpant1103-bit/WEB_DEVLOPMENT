<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form </title>
</head>
<body>
    <h2>Event Registration</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="example@gmail.com">
        <br><br>
        <label for="phone">Contact:</label>
        <input type="tel" name="phone" id="phone">
        <br><br>
        <label for="ocp">Ocupptaion</label>
        <select name="ocp" id="ocp">
            <option value="student">Student</option>
            <option value="professional">Professional</option>
            <option value="other">Other</option>
        </select>
        <fieldset>
            <legend>Topic of Interest</legend>
            <label for="check">HTML</label>
            <input type="checkbox" name="checkbox" id="check">
            <label for="check">CSS</label>
            <input type="checkbox" name="checkbox" id="check">
            <label for="check">JAVA SCRIPT</label>
            <input type="checkbox" name="checkbox" id="check">
        </fieldset>
        <label for="text">Comment</label>
        <br><br>
        <textarea rows="5" cols="10" name="text" id="text" placeholder="write"></textarea>
        <button>Register</button>
    </form>
</body>
</html>
