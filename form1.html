<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form </title>
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/components.js" defer></script>
</head>
<body>
    <h2>Event Registration</h2>
    <form action="#" method="post">
        <form-field label="Name:" type="text" name="name"></form-field>
        <form-field label="Email:" type="email" name="email" placeholder="example@gmail.com"></form-field>
        <form-field label="Contact:" type="tel" name="phone"></form-field>
        <form-field label="Occupation" type="select" name="ocp"
            options="Student=student, Professional=professional, Other=other"></form-field>
        <choice-group legend="Topic of Interest" type="checkbox" name="topics"
            options="HTML=html, CSS=css, JAVA SCRIPT=javascript"></choice-group>
        <form-field label="Comment" type="textarea" name="comment" rows="5" cols="30"
            placeholder="write"></form-field>
        <button type="submit">Register</button>
    </form>
</body>
</html>
