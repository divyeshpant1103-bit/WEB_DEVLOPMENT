<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/components.js" defer></script>
</head>
<body>
    <h2>Complex Form</h2>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <form-field label="Name" type="text" name="name"></form-field>
            <form-field label="Email:" type="email" name="email"></form-field>
            <form-field label="Phone" type="tel" name="phone"></form-field>
            <form-field label="Date Of Birth" type="date" name="dob"></form-field>
            <choice-group legend="Gender" type="radio" name="gender"
                options="Male=male, Female=female"></choice-group>
        </fieldset>
    </form>
</body>
</html>
